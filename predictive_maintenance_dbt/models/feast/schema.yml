version: 2

models:
  - name: feast__fct_sensor_features_inference
    description: >
      Always-fresh rolling/normalized sensor features (FR-FS-01), wide format
      (one row per equipment_id/reading_ts, one column per sensor_type per
      window), via the sensor_rolling_features macro. What cons.fct_anomaly_result/
      cons.fct_rul_prediction read from, not cons.fct_sensor_reading directly.
    columns:
      - name: equipment_id
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('cons__dim_equipment')
                field: equipment_id
      - name: reading_ts
        tests:
          - not_null

  - name: feast__fct_sensor_features_train
    description: >
      Frozen per-training-run snapshot -- identical sensor_rolling_features
      macro invocation as the inference table, different materialization
      (table, not dynamic_table) so training reads a fixed point-in-time input.
    columns:
      - name: equipment_id
        tests:
          - not_null

  - name: feast__training_dataset_iso
    description: >
      IsolationForest training set (S-MODEL-2) -- feast__fct_sensor_features_train
      plus a time-based dataset_split column (FR-FS-03). No spine/labels --
      unsupervised, so this is just the frozen snapshot with a split flag.
    columns:
      - name: equipment_id
        tests:
          - not_null
      - name: dataset_split
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ["train", "test"]
      - name: reading_ts
        tests:
          - not_null

  - name: feast__spine_maintenance_cycle
    description: >
      One row per sensor tick per maintenance cycle per machine (S-RUL-1,
      SH-86) -- cycle boundaries are every cons.fct_maintenance_event row
      (PM or BREAKDOWN both reset the wear clock) plus one still-open final
      cycle per machine. Right-censored survival labels: y_upper = y_lower
      for BREAKDOWN-ended cycles (observed failure), NULL for PM-ended/open
      cycles (censored). y_lower/y_upper are per-tick remaining operating
      hours to cycle end, reconstructed via tick position within the cycle
      against feast.fct_sensor_features_train, not calendar DATEDIFF.
    columns:
      - name: equipment_id
        tests:
          - not_null
      - name: reading_ts
        tests:
          - not_null
      - name: cycle_end_ts
        tests:
          - not_null
      - name: y_lower
        tests:
          - not_null

  - name: feast__training_dataset_rul
    description: >
      RUL training set (S-RUL-1/S-RUL-2, SH-86) -- feast__spine_maintenance_cycle
      (one row per tick per cycle) equi-joined against feast__fct_sensor_features_train
      for exact per-tick feature attachment, plus sliding 72h anomaly window
      aggregates (matching cons__fct_rul_prediction.sql's inference-side pattern),
      plus a time-based dataset_split column (FR-FS-03) anchored to MAX(cycle_end_ts)
      in the data. Also carries the isolation_forest_model's anomaly signal
      (single-tick is_anomaly/anomaly_score, computed directly against this table's
      own frozen feature snapshot -- not read from cons.fct_anomaly_result, SH-50).
    columns:
      - name: equipment_id
        tests:
          - not_null
      - name: reading_ts
        tests:
          - not_null
      - name: cycle_end_ts
        tests:
          - not_null
      - name: y_lower
        tests:
          - not_null
      - name: dataset_split
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ["train", "test"]
      - name: is_anomaly
        tests:
          - not_null
      - name: anomaly_score
        tests:
          - not_null
      - name: any_anomaly_flagged_72h
        description: >
          Sliding 72h window aggregate (ROWS BETWEEN 287 PRECEDING) -- never
          NULL with the sliding-window approach (early ticks get a smaller
          effective window, not NULL).
        tests:
          - not_null
      - name: min_anomaly_score_72h
        description: >
          Sliding 72h window aggregate -- never NULL (same reasoning as
          any_anomaly_flagged_72h).
        tests:
          - not_null
      - name: pct_anomalous_ticks_72h
        description: >
          Sliding 72h window aggregate, within [0, 1]. Never NULL.
        tests:
          - not_null
