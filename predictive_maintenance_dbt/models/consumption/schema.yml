version: 2

models:
  - name: cons__fct_sensor_reading
    description: >
      Lean atomic Consumption fact -- pass-through of STD.SENSOR_READING,
      real physical units, no aggregation/normalization. target_lag is
      temporarily 1 hour instead of the 15-minute demo-cadence spec (see
      std__sensor_reading.sql model config comment).
    columns:
      - name: reading_id
        tests:
          - not_null
      - name: equipment_id
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('cons__dim_equipment')
                field: equipment_id

  - name: cons__dim_equipment
    description: "1 row per equipment -- Semantic View Machine entity."
    columns:
      - name: equipment_id
        tests:
          - not_null

  - name: cons__fct_anomaly_result
    description: >
      IsolationForest inference (S-MODEL-3, FR-FS-00b) -- no stored procedure,
      no Task; predict/decision_function called directly in the dynamic
      table's SELECT against feast__fct_sensor_features_inference.
    columns:
      - name: equipment_id
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('cons__dim_equipment')
                field: equipment_id
      - name: reading_ts
        tests:
          - not_null
      - name: is_anomaly
        tests:
          - not_null

  - name: cons__fct_rul_prediction
    description: >
      RUL (remaining-useful-life) inference (S-RUL-5, FR-FS-00b) -- live
      counterpart to cons__fct_anomaly_result, calling rul_aft_model!predict()
      against feast__fct_sensor_features_inference joined with
      cons__fct_anomaly_result's own persisted is_anomaly/anomaly_score plus a
      72h-windowed aggregate of that same persisted history.
    columns:
      - name: equipment_id
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('cons__dim_equipment')
                field: equipment_id
      - name: reading_ts
        tests:
          - not_null
      - name: predicted_rul_hours
        tests:
          - not_null

  - name: cons__fct_order
    description: "Lean pass-through of STD.SALES_ORDER -- no aggregation."
    columns:
      - name: order_week
        tests:
          - not_null

  - name: cons__fct_inventory_fg
    description: "Lean pass-through of STD.INVENTORY_FG_SNAPSHOT -- snapshot_week renamed period_week."
    columns:
      - name: period_week
        tests:
          - not_null

  - name: cons__fct_inventory_spare
    description: "Lean pass-through of STD.SPARE_PART_SNAPSHOT -- snapshot_week renamed period_week."
    columns:
      - name: period_week
        tests:
          - not_null
      - name: equipment_id
        tests:
          - relationships:
              arguments:
                to: ref('cons__dim_equipment')
                field: equipment_id

  - name: cons__fct_oee
    description: >
      OEE fact, line x week grain (FR-PL-07/FR-PL-08). availability_pct is
      computed from BREAKDOWN-only CMMS downtime against calendar-scheduled
      hours for sensor-enabled equipment on the line; performance_pct/
      quality_pct are fixed dbt vars applied identically to every line.
    columns:
      - name: line_name
        tests:
          - not_null
      - name: period_week
        tests:
          - not_null

  - name: cons__fct_priority_score
    description: >
      Priority-score inference (S-RUL-6, FR-FS-08) -- 1 row / equipment,
      always latest (deliberate deviation from the per-tick grain originally
      specified in docs/04-1-LLD.md, see docs/designs/SH-47-priority-score.md
      §4). Every input CTE is filtered to latest-per-key before joining, so
      the join itself always runs against a handful of rows.
    columns:
      - name: equipment_id
        tests:
          - not_null
          - unique
          - relationships:
              arguments:
                to: ref('cons__dim_equipment')
                field: equipment_id
      - name: score_ts
        tests:
          - not_null
      - name: priority_score
        tests:
          - not_null

  - name: cons__fct_historical_dollar_impact
    description: >
      Historical realized $ impact per breakdown event (SH-85 §3.1 — grain
      changed from equipment-level to event-level). One row per
      (equipment_id, event_start_ts). Demand-capped throughput × unit margin.
      View over static tables.
    columns:
      - name: equipment_id
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('cons__dim_equipment')
                field: equipment_id
      - name: event_start_ts
        tests:
          - not_null
      - name: event_realized_impact_usd
        tests:
          - not_null

  - name: cons__fct_forward_dollar_at_risk
    description: >
      Forward-looking $ at risk per equipment (SH-84 §3.2) — projected $
      exposure if machines with predicted_rul_hours < 672 (4 weeks) fail
      before meeting demand. Dynamic table, DOWNSTREAM.
    columns:
      - name: equipment_id
        tests:
          - not_null
          - unique
          - relationships:
              arguments:
                to: ref('cons__dim_equipment')
                field: equipment_id
      - name: score_ts
        tests:
          - not_null
      - name: forward_dollar_at_risk_usd
        tests:
          - not_null

  - name: cons__fct_dollar_exposure
    description: >
      Dollar-exposure combiner (SH-84 §3.3) — thin join of historical
      realized impact (view) and forward $ at risk (dynamic DOWNSTREAM).
      New single leaf of the dynamic-table chain (target_lag=var('target_lag')).
    columns:
      - name: equipment_id
        tests:
          - not_null
          - unique
      - name: historical_realized_impact_usd
        tests:
          - not_null
      - name: forward_dollar_at_risk_usd
        tests:
          - not_null

  - name: cons__fct_maintenance_event
    description: "Lean pass-through of STD.CMMS_LOG -- 1 row / event, both PM and BREAKDOWN included."
    columns:
      - name: event_id
        tests:
          - not_null
      - name: equipment_id
        tests:
          - relationships:
              arguments:
                to: ref('cons__dim_equipment')
                field: equipment_id
