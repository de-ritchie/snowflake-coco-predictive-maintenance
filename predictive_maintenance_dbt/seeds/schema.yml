version: 2

seeds:
  - name: cons__dim_sensor_baseline
    description: >
      Static baseline reference data (Module 2 SENSOR_BASELINES) -- 3 rows
      only, CNC Boring x VIBRATION/TEMPERATURE/RPM, matching the thin
      dataset's actual scope. The other 6 rows (CNC Milling, CNC Horizontal)
      are deferred to EPIC-FULLDATA once those machines' RAW data lands.
    columns:
      - name: equipment_id
        tests:
          - not_null
      - name: sensor_type
        tests:
          - not_null

  - name: cons__dim_product
    description: >
      Static product/variant reference data (Module 1 DIM_PRODUCT) -- 4 rows,
      all product/variant combos, seeded rather than derived from RAW since
      no RAW table carries product_name and SALES_ORDER only ever contains
      2 of the 4 combos (secondary variants never generated).
    columns:
      - name: product_id
        tests:
          - not_null
      - name: variant
        tests:
          - not_null
